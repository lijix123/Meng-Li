name: astrbot_plugin_jmcomic
display_name: jm下载姬
desc: 禁漫本子一键下载插件。搜索、榜单、按ID下载，长图/zip/pdf三种格式交付，任务可查可取消。依赖完全自包含，装上即用，卸载即净，不污染系统环境。
help: |
  🎴 jm下载姬 · 禁漫本子下载

  搜本 <关键词> [页码]
    搜索本子，每页5条。例：搜本 无望菜志

  排行 [周/日/月]
    查看对应榜单 Top10。例：排行 周

  下本 <ID> [格式]
    下载本子。格式：长图/zip/pdf，缺省用面板默认。
    例：下本 243484 长图

  我的任务
    查看自己的下载任务和进度

  取消 <任务号>
    取消自己的任务。例：取消 1

  交付完自动清理服务器文件，不占磁盘。
version: v1.0.0
author: 梦璃
repo: https://github.com/hect0x7/JMComic-Crawler-Python
